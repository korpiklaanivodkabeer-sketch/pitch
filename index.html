<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音程チェッカー</title>
<style>
/* レイアウト: 1画面の縦積み。上から 音名 → セントメーター → 推移グラフ → 操作 */
:root {
  --bg: #e9edf2;
  --panel: #f8fafc;
  --ink: #16233a;
  --muted: #5d6b82;
  --line: #c9d2de;
  --accent: #c2410c;
  --good: #14804a;
  --font-display: "Avenir Next", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --font-body: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827;
    --panel: #1a2436;
    --ink: #e6ecf5;
    --muted: #93a1b8;
    --line: #2f3d55;
    --accent: #fb923c;
    --good: #4ade80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  display: flex;
  justify-content: center;
}
main {
  width: 100%;
  max-width: 480px;
  min-height: 100%;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.04em; }
#status { font-size: 12px; color: var(--muted); }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
}
#level { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
#levelbar { height: 100%; width: 0%; background: var(--muted); transition: width 0.08s linear; }
.levelrow { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.levelrow #level { flex: 1; }
/* 音名表示 */
#readout { text-align: center; transition: opacity 0.2s; }
#readout.idle { opacity: 0.4; }
#note {
  font-family: var(--font-display);
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
#note sub { font-size: 0.4em; font-weight: 500; vertical-align: baseline; margin-left: 2px; color: var(--muted); }
#readout.intune #note { color: var(--good); }
#solfege { font-size: 16px; color: var(--muted); margin-top: 6px; min-height: 1.4em; }
.figures {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-top: 10px;
  font-variant-numeric: tabular-nums;
  font-size: 15px;
}
.figures span span { color: var(--muted); font-size: 12px; margin-left: 3px; }
/* セントメーター */
#meter { position: relative; height: 54px; }
#meter .track {
  position: absolute; left: 0; right: 0; top: 16px; height: 10px;
  border-radius: 5px;
  background: var(--line);
}
#meter .zone {
  position: absolute; top: 16px; height: 10px;
  left: 45%; width: 10%;
  background: var(--good); opacity: 0.45;
}
#meter .center { position: absolute; left: 50%; top: 8px; width: 2px; height: 26px; margin-left: -1px; background: var(--muted); }
#needle {
  position: absolute; top: 4px; left: 50%;
  width: 6px; height: 34px; margin-left: -3px;
  border-radius: 3px;
  background: var(--accent);
  transition: left 0.08s linear, opacity 0.2s;
}
#needle.idle { opacity: 0.25; }
#needle.intune { background: var(--good); }
#meter .labels {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted);
}
/* グラフ */
.graphwrap { flex: 1; min-height: 160px; display: flex; flex-direction: column; gap: 6px; padding: 12px; }
.graphwrap h2 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 0; }
#graph { flex: 1; width: 100%; min-height: 130px; display: block; }
/* 操作 */
.controls { display: flex; gap: 10px; align-items: stretch; }
button {
  font: inherit; color: inherit;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#toggle {
  flex: 1;
  background: var(--ink); color: var(--bg);
  border-color: var(--ink);
  font-weight: 600; font-size: 16px;
}
.a4 {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel);
  padding: 0 6px 0 12px; font-size: 13px;
}
.a4 button { border: none; padding: 8px 10px; font-size: 16px; background: transparent; }
#a4val { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: center; }
#message {
  font-size: 13px; line-height: 1.6;
  color: var(--accent);
  margin: 0;
}
#message:empty { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>音程チェッカー</h1>
    <span id="status">停止中</span>
  </header>

  <div class="levelrow"><span>マイク入力</span><div id="level"><div id="levelbar"></div></div></div>

  <section class="panel">
    <div id="readout" class="idle">
      <div id="note">–</div>
      <div id="solfege"></div>
      <div class="figures">
        <span><b id="cents">±0</b><span>セント</span></span>
        <span><b id="hz">–</b><span>Hz</span></span>
      </div>
    </div>
    <div id="meter" aria-hidden="true">
      <div class="track"></div>
      <div class="zone"></div>
      <div class="center"></div>
      <div id="needle" class="idle"></div>
      <div class="labels"><span>低い −50</span><span>0</span><span>+50 高い</span></div>
    </div>
  </section>

  <section class="panel graphwrap">
    <h2>音程の推移（直近8秒）</h2>
    <canvas id="graph"></canvas>
  </section>

  <p id="message" role="alert"></p>

  <div class="controls">
    <button id="toggle" type="button">マイクを開始</button>
    <div class="a4">
      <span>基準 A4</span>
      <button id="a4down" type="button" aria-label="基準音を1Hz下げる">−</button>
      <span id="a4val">440 Hz</span>
      <button id="a4up" type="button" aria-label="基準音を1Hz上げる">＋</button>
    </div>
  </div>
</main>

<script>
/*PITCH-START*/
// McLeod Pitch Method（正規化自己相関）で基本周波数を推定する。
// 戻り値: { freq, clarity } または null（無音・不明瞭なとき）
function detectPitch(buf, sampleRate) {
  var N = buf.length, i, tau;
  var sumSq = 0;
  for (i = 0; i < N; i++) sumSq += buf[i] * buf[i];
  if (Math.sqrt(sumSq / N) < 0.002) return null; // 小さすぎる音は無視

  var maxTau = Math.min(Math.floor(sampleRate / 55), N >> 1); // 下限 約55Hz
  var W = N - maxTau;
  var nsdf = new Float32Array(maxTau + 1);
  for (tau = 0; tau <= maxTau; tau++) {
    var acf = 0, m = 0;
    for (i = 0; i < W; i++) {
      var a = buf[i], b = buf[i + tau];
      acf += a * b;
      m += a * a + b * b;
    }
    nsdf[tau] = m > 0 ? 2 * acf / m : 0;
  }

  // 最初の山（tau=0付近）を飛ばし、正の区間ごとの最大点を集める
  tau = 1;
  while (tau <= maxTau && nsdf[tau] > 0) tau++;
  var peaks = [], best = -1;
  for (; tau < maxTau; tau++) {
    if (nsdf[tau] > 0) {
      if (nsdf[tau] > nsdf[tau - 1] && nsdf[tau] >= nsdf[tau + 1]) {
        if (best < 0 || nsdf[tau] > nsdf[best]) best = tau;
      }
    } else if (best >= 0) {
      peaks.push(best); best = -1;
    }
  }
  if (best >= 0) peaks.push(best);
  if (!peaks.length) return null;

  var globalMax = 0;
  for (i = 0; i < peaks.length; i++) if (nsdf[peaks[i]] > globalMax) globalMax = nsdf[peaks[i]];
  var chosen = peaks[0];
  for (i = 0; i < peaks.length; i++) {
    if (nsdf[peaks[i]] >= 0.9 * globalMax) { chosen = peaks[i]; break; }
  }
  var clarity = nsdf[chosen];
  if (clarity < 0.8) return null;

  // 放物線補間でサンプル間の位置を求める
  var y0 = nsdf[chosen - 1], y1 = nsdf[chosen], y2 = nsdf[chosen + 1];
  var denom = y0 - 2 * y1 + y2;
  var shift = denom !== 0 ? 0.5 * (y0 - y2) / denom : 0;
  var freq = sampleRate / (chosen + shift);
  if (freq > 2100) return null;
  return { freq: freq, clarity: clarity };
}
/*PITCH-END*/

var NOTE_NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
var SOLFEGE = ["ド", "ド♯", "レ", "レ♯", "ミ", "ファ", "ファ♯", "ソ", "ソ♯", "ラ", "ラ♯", "シ"];
var HISTORY_MS = 8000;

var els = {};
["status", "readout", "note", "solfege", "cents", "hz", "needle", "graph", "message", "toggle", "a4down", "a4up", "a4val", "levelbar"]
  .forEach(function (id) { els[id] = document.getElementById(id); });

var a4 = 440;
try {
  var saved = parseInt(localStorage.getItem("pitch-a4"), 10);
  if (saved >= 430 && saved <= 450) a4 = saved;
} catch (e) {}

var audioCtx = null, analyser = null, stream = null, buffer = null;
var running = false, lastAnalysis = 0, lastHeard = 0;
var recent = [];   // 直近の検出周波数（中央値で表示を安定させる）
var history = [];  // { t, midi } グラフ用
var graphCenter = 69;

function freqToMidi(f) { return 69 + 12 * Math.log(f / a4) / Math.LN2; }

function setA4(v) {
  a4 = Math.max(430, Math.min(450, v));
  els.a4val.textContent = a4 + " Hz";
  try { localStorage.setItem("pitch-a4", String(a4)); } catch (e) {}
}
els.a4down.addEventListener("click", function () { setA4(a4 - 1); });
els.a4up.addEventListener("click", function () { setA4(a4 + 1); });
setA4(a4);

function showMessage(text) { els.message.textContent = text || ""; }

function start() {
  showMessage("");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMessage("このページではマイクを使えません。https:// で始まるアドレスで開いてください（ファイルを直接開いた場合や、他のアプリ内に埋め込まれた表示では動きません）。");
    return;
  }
  // 音声処理はタップの中で開始しておく（iPhoneでは後から開始すると止まったままになる）
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) { showMessage("このブラウザは音声処理に対応していません。"); return; }
  audioCtx = new Ctx();
  audioCtx.resume();
  els.status.textContent = "マイクの許可を待っています";
  navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  }).then(function (s) {
    stream = s;
    if (audioCtx.state !== "running") audioCtx.resume();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    // 出力につながっていないと処理が動かないブラウザがあるため、音量0で出力へつなぐ
    var mute = audioCtx.createGain();
    mute.gain.value = 0;
    analyser.connect(mute);
    mute.connect(audioCtx.destination);
    buffer = new Float32Array(analyser.fftSize);
    running = true;
    els.toggle.textContent = "停止";
    els.status.textContent = "聞き取り中";
    requestAnimationFrame(loop);
  }).catch(function (err) {
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    els.status.textContent = "停止中";
    if (err && (err.name === "NotAllowedError" || err.name === "SecurityError")) {
      showMessage("マイクの使用が許可されませんでした。ブラウザの設定でこのページのマイクを許可してから、もう一度開始してください。");
    } else if (err && err.name === "NotFoundError") {
      showMessage("マイクが見つかりません。マイクが接続されているか確認してください。");
    } else {
      showMessage("マイクを開始できませんでした（" + (err && err.name ? err.name : "不明なエラー") + "）。");
    }
  });
}

function stop() {
  running = false;
  if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  if (audioCtx) audioCtx.close();
  stream = audioCtx = analyser = null;
  els.toggle.textContent = "マイクを開始";
  els.status.textContent = "停止中";
  els.readout.classList.add("idle");
  els.needle.classList.add("idle");
  els.levelbar.style.width = "0%";
}

els.toggle.addEventListener("click", function () { running ? stop() : start(); });

function median(arr) {
  var s = arr.slice().sort(function (x, y) { return x - y; });
  return s[s.length >> 1];
}

function loop(now) {
  if (!running) return;
  requestAnimationFrame(loop);
  if (now - lastAnalysis < 33) return; // 毎秒30回程度
  lastAnalysis = now;

  if (audioCtx.state !== "running") {
    audioCtx.resume();
    els.status.textContent = "音声処理が止まっています（画面をタップ）";
    return;
  }
  els.status.textContent = "聞き取り中";
  analyser.getFloatTimeDomainData(buffer);
  var sq = 0;
  for (var k = 0; k < buffer.length; k++) sq += buffer[k] * buffer[k];
  var db = 20 * Math.log(Math.sqrt(sq / buffer.length) + 1e-9) / Math.LN10;
  els.levelbar.style.width = Math.max(0, Math.min(100, (db + 70) / 60 * 100)) + "%";
  var result = detectPitch(buffer, audioCtx.sampleRate);

  if (result) {
    recent.push(result.freq);
    if (recent.length > 5) recent.shift();
    lastHeard = now;
    var f = median(recent);
    var midi = freqToMidi(f);
    history.push({ t: now, midi: freqToMidi(result.freq) });
    render(f, midi);
  } else {
    history.push({ t: now, midi: null });
    if (now - lastHeard > 300) {
      recent.length = 0;
      els.readout.classList.add("idle");
      els.needle.classList.add("idle");
    }
  }
  while (history.length && now - history[0].t > HISTORY_MS) history.shift();
  drawGraph(now);
}

function render(freq, midi) {
  var nearest = Math.round(midi);
  var cents = Math.round((midi - nearest) * 100);
  var idx = ((nearest % 12) + 12) % 12;
  var octave = Math.floor(nearest / 12) - 1;
  var inTune = Math.abs(cents) <= 5;

  els.note.innerHTML = NOTE_NAMES[idx] + "<sub>" + octave + "</sub>";
  els.solfege.textContent = SOLFEGE[idx];
  els.cents.textContent = (cents > 0 ? "+" : cents < 0 ? "−" : "±") + Math.abs(cents);
  els.hz.textContent = freq.toFixed(1);
  els.readout.classList.remove("idle");
  els.readout.classList.toggle("intune", inTune);
  els.needle.classList.remove("idle");
  els.needle.classList.toggle("intune", inTune);
  els.needle.style.left = (50 + cents) + "%";
}

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function drawGraph(now) {
  var canvas = els.graph;
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  var ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // 表示範囲の中心を、最近の音程にゆっくり追従させる
  var vals = [];
  for (var i = 0; i < history.length; i++) if (history[i].midi !== null) vals.push(history[i].midi);
  if (vals.length) graphCenter += (median(vals) - graphCenter) * 0.08;

  var span = 14; // 表示する半音数
  var labelW = 34;
  var lo = graphCenter - span / 2;
  function y(m) { return h - (m - lo) / span * h; }
  function x(t) { return labelW + (1 - (now - t) / HISTORY_MS) * (w - labelW); }

  var line = cssVar("--line"), muted = cssVar("--muted"), accent = cssVar("--accent");
  ctx.font = "11px sans-serif";
  ctx.textBaseline = "middle";
  for (var n = Math.ceil(lo); n <= lo + span; n++) {
    var yy = y(n);
    var idx = ((n % 12) + 12) % 12;
    var natural = NOTE_NAMES[idx].length === 1;
    ctx.strokeStyle = line;
    ctx.globalAlpha = natural ? 1 : 0.4;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(labelW, yy); ctx.lineTo(w, yy); ctx.stroke();
    ctx.globalAlpha = 1;
    if (natural) {
      ctx.fillStyle = muted;
      ctx.fillText(NOTE_NAMES[idx] + (Math.floor(n / 12) - 1), 0, yy);
    }
  }

  ctx.strokeStyle = accent;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.beginPath();
  var pen = false, prev = null;
  for (i = 0; i < history.length; i++) {
    var p = history[i];
    if (p.midi === null || (prev !== null && Math.abs(p.midi - prev) > 1.5)) { pen = false; }
    if (p.midi === null) { prev = null; continue; }
    if (!pen) { ctx.moveTo(x(p.t), y(p.midi)); ctx.lineTo(x(p.t) + 0.1, y(p.midi)); pen = true; }
    else ctx.lineTo(x(p.t), y(p.midi));
    prev = p.midi;
  }
  ctx.stroke();
}

drawGraph(performance.now());
window.addEventListener("resize", function () { drawGraph(performance.now()); });
</script>
</body>
</html>
